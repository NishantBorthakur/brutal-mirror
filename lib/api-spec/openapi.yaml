openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: Brutal Mirror roast operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: createRoast
      tags: [roast]
      summary: Generate a brutal AI roast
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastRequest"
      responses:
        "200":
          description: Roast generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "402":
          description: Out of credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfCreditsError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastRequest:
      type: object
      properties:
        category:
          type: string
          description: The category of content being roasted
        intensity:
          type: string
          description: Intensity level (Honest, Harsh, Brutal, Career-ending)
        content:
          type: string
          description: The content to be roasted (20–3000 chars)
        personality:
          type: string
          description: Roast personality mode
        refinementMode:
          type: string
          description: Optional refinement mode (sharper, funnier, professional)
      required:
        - category
        - intensity
        - content
        - personality
    RoastScoreReport:
      type: object
      properties:
        overallRoastScore:
          type: integer
        clarity:
          type: integer
        originality:
          type: integer
        marketability:
          type: integer
        cringeLevel:
          type: integer
        fixability:
          type: integer
      required:
        - overallRoastScore
        - clarity
        - originality
        - marketability
        - cringeLevel
        - fixability
    RoastResult:
      type: object
      properties:
        viralOneLiner:
          type: string
          description: One devastating shareable sentence
        brutalRoast:
          type: string
          description: The main roast
        actualDiagnosis:
          type: string
          description: The real diagnosis of the issue
        biggestWeaknesses:
          type: array
          items:
            type: string
          description: List of biggest weaknesses
        threeFixes:
          type: array
          items:
            type: string
          description: Three actionable fixes
        improvedVersion:
          type: string
          description: An improved version of the input
        scoreReport:
          $ref: "#/components/schemas/RoastScoreReport"
        creditsRemaining:
          type: integer
          description: User's remaining credit balance after this roast
      required:
        - brutalRoast
        - actualDiagnosis
        - biggestWeaknesses
        - threeFixes
        - improvedVersion
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthError:
      type: object
      properties:
        error:
          type: string
          enum: [AUTH_REQUIRED]
        message:
          type: string
      required:
        - error
        - message
    OutOfCreditsError:
      type: object
      properties:
        error:
          type: string
          enum: [OUT_OF_CREDITS]
        message:
          type: string
      required:
        - error
        - message
