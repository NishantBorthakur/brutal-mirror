openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: Brutal Mirror roast operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: createRoast
      tags: [roast]
      summary: Generate a brutal AI roast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastRequest"
      responses:
        "200":
          description: Roast generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastRequest:
      type: object
      properties:
        category:
          type: string
          description: The category of content being roasted
        intensity:
          type: string
          description: Intensity level of the roast (Honest, Harsh, Brutal, Career-ending)
        content:
          type: string
          description: The content to be roasted
      required:
        - category
        - intensity
        - content
    RoastResult:
      type: object
      properties:
        brutalRoast:
          type: string
          description: The main roast
        actualDiagnosis:
          type: string
          description: The real diagnosis of the issue
        biggestWeaknesses:
          type: array
          items:
            type: string
          description: List of biggest weaknesses
        threeFixes:
          type: array
          items:
            type: string
          description: Three actionable fixes
        improvedVersion:
          type: string
          description: An improved version of the input
      required:
        - brutalRoast
        - actualDiagnosis
        - biggestWeaknesses
        - threeFixes
        - improvedVersion
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
