openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: Brutal Mirror roast operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: createRoast
      tags: [roast]
      summary: Generate a brutal AI roast
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastRequest"
      responses:
        "200":
          description: Roast generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Out of credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profile:
    get:
      operationId: getUserProfile
      tags: [roast]
      summary: Get authenticated user's profile including credit balance
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /account/me:
    get:
      operationId: getAccountMe
      tags: [roast]
      summary: Get authenticated user account and credit balance
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Account info retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/create-order:
    post:
      operationId: createBillingOrder
      tags: [billing]
      summary: Create a Razorpay order for a credit pack
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Invalid pack ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/verify-payment:
    post:
      operationId: verifyBillingPayment
      tags: [billing]
      summary: Verify a Razorpay payment and credit the user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Payment verified and credits added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPaymentResponse"
        "400":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Order belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/transactions:
    get:
      operationId: getBillingTransactions
      tags: [billing]
      summary: Get the authenticated user's credit transaction history
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastRequest:
      type: object
      properties:
        category:
          type: string
          description: The category of content being roasted
        intensity:
          type: string
          description: Intensity level (Honest, Harsh, Brutal, Career-ending)
        content:
          type: string
          description: The content to be roasted (20–3000 chars)
        personality:
          type: string
          description: Roast personality mode
        refinementMode:
          type: string
          description: Optional refinement mode (sharper, funnier, professional)
      required:
        - category
        - intensity
        - content
        - personality
    RoastScoreReport:
      type: object
      properties:
        overallRoastScore:
          type: integer
        clarity:
          type: integer
        originality:
          type: integer
        marketability:
          type: integer
        cringeLevel:
          type: integer
        fixability:
          type: integer
      required:
        - overallRoastScore
        - clarity
        - originality
        - marketability
        - cringeLevel
        - fixability
    RoastResult:
      type: object
      properties:
        viralOneLiner:
          type: string
          description: One devastating shareable sentence
        brutalRoast:
          type: string
          description: The main roast
        actualDiagnosis:
          type: string
          description: The real diagnosis of the issue
        biggestWeaknesses:
          type: array
          items:
            type: string
          description: List of biggest weaknesses
        threeFixes:
          type: array
          items:
            type: string
          description: Three actionable fixes
        improvedVersion:
          type: string
          description: An improved version of the input
        scoreReport:
          $ref: "#/components/schemas/RoastScoreReport"
        creditsRemaining:
          type: integer
          description: User's remaining credit balance after this roast
      required:
        - brutalRoast
        - actualDiagnosis
        - biggestWeaknesses
        - threeFixes
        - improvedVersion
    UserProfile:
      type: object
      properties:
        credits:
          type: integer
          description: Current credit balance
      required:
        - credits
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AccountMeResponse:
      type: object
      required: [user, creditsBalance]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        creditsBalance:
          type: integer
    CreateOrderRequest:
      type: object
      required: [packId]
      properties:
        packId:
          type: string
          enum: [starter, value, power]
    CreateOrderResponse:
      type: object
      required: [orderId, amount, currency, keyId, packId, credits, packLabel]
      properties:
        orderId:
          type: string
        amount:
          type: integer
          description: Amount in paise
        currency:
          type: string
        keyId:
          type: string
        packId:
          type: string
        credits:
          type: integer
        packLabel:
          type: string
    VerifyPaymentRequest:
      type: object
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
    VerifyPaymentResponse:
      type: object
      required: [success, creditsBalance]
      properties:
        success:
          type: boolean
        creditsBalance:
          type: integer
        alreadyVerified:
          type: boolean
    TransactionItem:
      type: object
      required: [id, type, credits, reason, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        credits:
          type: integer
        balanceAfter:
          type: integer
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    TransactionsResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
